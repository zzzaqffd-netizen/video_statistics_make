<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>05 · CHIPS · Crimson Pulse</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { overflow-y: auto; background: radial-gradient(circle at top, #ff336622 0%, #05050a 70%); }
    .wrap { width: 100%; min-height: 100vh; padding: 88px 28px 36px; display: flex; flex-direction: column; }
    .pill-link { text-decoration: none; color: #fff; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); font-size: 0.8rem; font-weight: 600; }
    .pill-link:hover { background: rgba(255,255,255,0.18); }
    .hero { background: linear-gradient(135deg, #ff336618 0%, rgba(12,14,24,0.88) 70%); border: 1px solid #ff336655; border-radius: 22px; padding: 36px; flex: 1; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 20px 60px #ff33661a; }
    .hero-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .hero h2 { font-size: 2.2rem; margin: 12px 0 4px; }
    .big-val { font-size: 3.4rem; font-weight: 800; color: #ff3366; margin: 8px 0 24px; }
    .bar-row { margin-bottom: 16px; }
    .bar-meta { display: flex; justify-content: space-between; font-size: 0.95rem; margin-bottom: 6px; }
    .bar-track { height: 14px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; width: 0%; transition: width 180s cubic-bezier(0.22, 1, 0.36, 1); }
  </style>
</head>
<body>
  <header class="hud-top">
    <div class="brand">
      <span class="brand-dot" style="background:#ff3366;box-shadow:0 0 16px #ff3366;"></span>
      <h1>05 // CHIPS <span class="badge">UNIQUE PAGE</span></h1>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto;">
      <a href="/nvda" class="pill-link">01 NVDA</a> <a href="/tsla" class="pill-link">02 TSLA</a> <a href="/wealth" class="pill-link">03 WEALTH</a> <a href="/cloud" class="pill-link">04 CLOUD</a> <a href="/chips" class="pill-link">05 CHIPS</a>
      <a href="/" class="pill-link">← 3D Stage</a>
    </div>
  </header>
  <main class="wrap">
    <section class="hero">
      <div class="hero-top">
        <span style="color:#ff3366;font-weight:700;letter-spacing:0.1em;">CHIPS · CRIMSON PULSE</span>
        <span class="badge" style="border-color:#c084fc;color:#c084fc;">+49.8% YoY · #1</span>
      </div>
      <h2>Silicon & Compute</h2>
      <div class="big-val">$2.24T</div>
      <div class="bar-row">
          <div class="bar-meta"><span>#1 NVDA · NVIDIA</span><span style="color:#ff3366;font-weight:700">$3,420B</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="100" style="background:linear-gradient(90deg,#76b900,#ff3366)"></div></div>
        </div>
<div class="bar-row">
          <div class="bar-meta"><span>#2 TSM · TSMC</span><span style="color:#fff;font-weight:700">$980B</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="29" style="background:linear-gradient(90deg,#e11d48,#ff3366)"></div></div>
        </div>
<div class="bar-row">
          <div class="bar-meta"><span>#3 AVGO · Broadcom</span><span style="color:#fff;font-weight:700">$840B</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="25" style="background:linear-gradient(90deg,#dc2626,#ff3366)"></div></div>
        </div>
<div class="bar-row">
          <div class="bar-meta"><span>#4 ASML · ASML</span><span style="color:#fff;font-weight:700">$310B</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="9" style="background:linear-gradient(90deg,#2563eb,#ff3366)"></div></div>
        </div>
<div class="bar-row">
          <div class="bar-meta"><span>#5 AMD · AMD</span><span style="color:#fff;font-weight:700">$245B</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="7" style="background:linear-gradient(90deg,#0d9488,#ff3366)"></div></div>
        </div>
<div class="bar-row">
          <div class="bar-meta"><span>#6 INTC · Intel</span><span style="color:#fff;font-weight:700">$98B</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="3" style="background:linear-gradient(90deg,#0284c7,#ff3366)"></div></div>
        </div>
    </section>
  </main>
  <script>
    requestAnimationFrame(() => {
      document.querySelectorAll(".bar-fill").forEach((el) => { el.style.width = el.dataset.pct + "%"; });
    });
  </script>
</body>
</html>
