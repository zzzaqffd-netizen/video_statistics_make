<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>04 · CLOUD · Emerald Matrix</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { overflow-y: auto; background: radial-gradient(circle at top, #10b98122 0%, #05050a 70%); }
    .wrap { width: 100%; min-height: 100vh; padding: 88px 28px 36px; display: flex; flex-direction: column; }
    .pill-link { text-decoration: none; color: #fff; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); font-size: 0.8rem; font-weight: 600; }
    .pill-link:hover { background: rgba(255,255,255,0.18); }
    .hero { background: linear-gradient(135deg, #10b98118 0%, rgba(12,14,24,0.88) 70%); border: 1px solid #10b98155; border-radius: 22px; padding: 36px; flex: 1; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 20px 60px #10b9811a; }
    .hero-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .hero h2 { font-size: 2.2rem; margin: 12px 0 4px; }
    .big-val { font-size: 3.4rem; font-weight: 800; color: #10b981; margin: 8px 0 24px; }
    .bar-row { margin-bottom: 16px; }
    .bar-meta { display: flex; justify-content: space-between; font-size: 0.95rem; margin-bottom: 6px; }
    .bar-track { height: 14px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; width: 0%; transition: width 180s cubic-bezier(0.22, 1, 0.36, 1); }
  </style>
</head>
<body>
  <header class="hud-top">
    <div class="brand">
      <span class="brand-dot" style="background:#10b981;box-shadow:0 0 16px #10b981;"></span>
      <h1>04 // CLOUD <span class="badge">UNIQUE PAGE</span></h1>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto;">
      <a href="/nvda" class="pill-link">01 NVDA</a> <a href="/tsla" class="pill-link">02 TSLA</a> <a href="/wealth" class="pill-link">03 WEALTH</a> <a href="/cloud" class="pill-link">04 CLOUD</a> <a href="/chips" class="pill-link">05 CHIPS</a>
      <a href="/" class="pill-link">← 3D Stage</a>
    </div>
  </header>
  <main class="wrap">
    <section class="hero">
      <div class="hero-top">
        <span style="color:#10b981;font-weight:700;letter-spacing:0.1em;">CLOUD · EMERALD MATRIX</span>
        <span class="badge" style="border-color:#a3e635;color:#a3e635;">+31.2% YoY · AZURE</span>
      </div>
      <h2>Cloud & AI Revenue</h2>
      <div class="big-val">$3.18T</div>
      <div class="bar-row">
          <div class="bar-meta"><span>#1 AWS · Amazon</span><span style="color:#10b981;font-weight:700">$108B</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="100" style="background:linear-gradient(90deg,#f59e0b,#10b981)"></div></div>
        </div>
<div class="bar-row">
          <div class="bar-meta"><span>#2 Azure · Microsoft</span><span style="color:#fff;font-weight:700">$96B</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="89" style="background:linear-gradient(90deg,#0ea5e9,#10b981)"></div></div>
        </div>
<div class="bar-row">
          <div class="bar-meta"><span>#3 GCP · Google</span><span style="color:#fff;font-weight:700">$44B</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="41" style="background:linear-gradient(90deg,#10b981,#10b981)"></div></div>
        </div>
<div class="bar-row">
          <div class="bar-meta"><span>#4 CRM · Salesforce</span><span style="color:#fff;font-weight:700">$38B</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="35" style="background:linear-gradient(90deg,#06b6d4,#10b981)"></div></div>
        </div>
<div class="bar-row">
          <div class="bar-meta"><span>#5 OCI · Oracle</span><span style="color:#fff;font-weight:700">$24B</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="22" style="background:linear-gradient(90deg,#ef4444,#10b981)"></div></div>
        </div>
<div class="bar-row">
          <div class="bar-meta"><span>#6 NOW · ServiceNow</span><span style="color:#fff;font-weight:700">$11B</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="10" style="background:linear-gradient(90deg,#84cc16,#10b981)"></div></div>
        </div>
    </section>
  </main>
  <script>
    requestAnimationFrame(() => {
      document.querySelectorAll(".bar-fill").forEach((el) => { el.style.width = el.dataset.pct + "%"; });
    });
  </script>
</body>
</html>
