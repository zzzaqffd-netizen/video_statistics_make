<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>02 · TSLA · Solaris Gold</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { overflow-y: auto; background: radial-gradient(circle at top, #ffb70322 0%, #05050a 70%); }
    .wrap { max-width: 960px; margin: 0 auto; padding: 100px 24px 64px; }
    .pill-link { text-decoration: none; color: #fff; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); font-size: 0.8rem; font-weight: 600; }
    .pill-link:hover { background: rgba(255,255,255,0.18); }
    .hero { background: linear-gradient(135deg, #ffb70318 0%, rgba(12,14,24,0.88) 70%); border: 1px solid #ffb70355; border-radius: 22px; padding: 36px; box-shadow: 0 20px 60px #ffb7031a; }
    .hero-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .hero h2 { font-size: 2.2rem; margin: 12px 0 4px; }
    .big-val { font-size: 3.4rem; font-weight: 800; color: #ffb703; margin: 8px 0 24px; }
    .bar-row { margin-bottom: 16px; }
    .bar-meta { display: flex; justify-content: space-between; font-size: 0.95rem; margin-bottom: 6px; }
    .bar-track { height: 14px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; width: 0%; transition: width 180s cubic-bezier(0.22, 1, 0.36, 1); }
  </style>
</head>
<body>
  <header class="hud-top">
    <div class="brand">
      <span class="brand-dot" style="background:#ffb703;box-shadow:0 0 16px #ffb703;"></span>
      <h1>02 // TSLA <span class="badge">UNIQUE PAGE</span></h1>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto;">
      <a href="/nvda" class="pill-link">01 NVDA</a> <a href="/tsla" class="pill-link">02 TSLA</a> <a href="/wealth" class="pill-link">03 WEALTH</a> <a href="/cloud" class="pill-link">04 CLOUD</a> <a href="/chips" class="pill-link">05 CHIPS</a>
      <a href="/" class="pill-link">← 3D Stage</a>
    </div>
  </header>
  <main class="wrap">
    <section class="hero">
      <div class="hero-top">
        <span style="color:#ffb703;font-weight:700;letter-spacing:0.1em;">TSLA · SOLARIS GOLD</span>
        <span class="badge" style="border-color:#fb8500;color:#fb8500;">+72.4% Q4 · $348.90</span>
      </div>
      <h2>Tesla Valuation & EV Surge</h2>
      <div class="big-val">$1.12T</div>
      <div class="bar-row">
          <div class="bar-meta"><span>#1 TSLA · Tesla</span><span style="color:#ffb703;font-weight:700">$1,120B</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="100" style="background:linear-gradient(90deg,#e11d48,#ffb703)"></div></div>
        </div>
<div class="bar-row">
          <div class="bar-meta"><span>#2 TM · Toyota</span><span style="color:#fff;font-weight:700">$245B</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="22" style="background:linear-gradient(90deg,#ea580c,#ffb703)"></div></div>
        </div>
<div class="bar-row">
          <div class="bar-meta"><span>#3 BYD · BYD Auto</span><span style="color:#fff;font-weight:700">$118B</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="11" style="background:linear-gradient(90deg,#0284c7,#ffb703)"></div></div>
        </div>
<div class="bar-row">
          <div class="bar-meta"><span>#4 RACE · Ferrari</span><span style="color:#fff;font-weight:700">$84B</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="8" style="background:linear-gradient(90deg,#dc2626,#ffb703)"></div></div>
        </div>
<div class="bar-row">
          <div class="bar-meta"><span>#5 P911 · Porsche</span><span style="color:#fff;font-weight:700">$62B</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="6" style="background:linear-gradient(90deg,#ca8a04,#ffb703)"></div></div>
        </div>
<div class="bar-row">
          <div class="bar-meta"><span>#6 RIVN · Rivian</span><span style="color:#fff;font-weight:700">$14B</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="2" style="background:linear-gradient(90deg,#16a34a,#ffb703)"></div></div>
        </div>
    </section>
  </main>
  <script>
    requestAnimationFrame(() => {
      document.querySelectorAll(".bar-fill").forEach((el) => { el.style.width = el.dataset.pct + "%"; });
    });
  </script>
</body>
</html>
