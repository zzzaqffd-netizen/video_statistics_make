<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>01 · NVDA · Cyberpunk Neon</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { overflow-y: auto; background: radial-gradient(circle at top, #00f0ff22 0%, #05050a 70%); }
    .wrap { max-width: 960px; margin: 0 auto; padding: 100px 24px 64px; }
    .pill-link { text-decoration: none; color: #fff; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); font-size: 0.8rem; font-weight: 600; }
    .pill-link:hover { background: rgba(255,255,255,0.18); }
    .hero { background: linear-gradient(135deg, #00f0ff18 0%, rgba(12,14,24,0.88) 70%); border: 1px solid #00f0ff55; border-radius: 22px; padding: 36px; box-shadow: 0 20px 60px #00f0ff1a; }
    .hero-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .hero h2 { font-size: 2.2rem; margin: 12px 0 4px; }
    .big-val { font-size: 3.4rem; font-weight: 800; color: #00f0ff; margin: 8px 0 24px; }
    .bar-row { margin-bottom: 16px; }
    .bar-meta { display: flex; justify-content: space-between; font-size: 0.95rem; margin-bottom: 6px; }
    .bar-track { height: 14px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; width: 0%; transition: width 180s cubic-bezier(0.22, 1, 0.36, 1); }
  </style>
</head>
<body>
  <header class="hud-top">
    <div class="brand">
      <span class="brand-dot" style="background:#00f0ff;box-shadow:0 0 16px #00f0ff;"></span>
      <h1>01 // NVDA <span class="badge">UNIQUE PAGE</span></h1>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto;">
      <a href="/nvda" class="pill-link">01 NVDA</a> <a href="/tsla" class="pill-link">02 TSLA</a> <a href="/wealth" class="pill-link">03 WEALTH</a> <a href="/cloud" class="pill-link">04 CLOUD</a> <a href="/chips" class="pill-link">05 CHIPS</a>
      <a href="/" class="pill-link">← 3D Stage</a>
    </div>
  </header>
  <main class="wrap">
    <section class="hero">
      <div class="hero-top">
        <span style="color:#00f0ff;font-weight:700;letter-spacing:0.1em;">NVDA · CYBERPUNK NEON</span>
        <span class="badge" style="border-color:#ff2a85;color:#ff2a85;">+184.6% YTD · $139.40</span>
      </div>
      <h2>NVIDIA Market Cap Surge</h2>
      <div class="big-val">$3.42T</div>
      <div class="bar-row">
          <div class="bar-meta"><span>#1 NVDA · NVIDIA</span><span style="color:#00f0ff;font-weight:700">$3.42T</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="100" style="background:linear-gradient(90deg,#76b900,#00f0ff)"></div></div>
        </div>
<div class="bar-row">
          <div class="bar-meta"><span>#2 AAPL · Apple</span><span style="color:#fff;font-weight:700">$3.35T</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="98" style="background:linear-gradient(90deg,#64748b,#00f0ff)"></div></div>
        </div>
<div class="bar-row">
          <div class="bar-meta"><span>#3 MSFT · Microsoft</span><span style="color:#fff;font-weight:700">$3.18T</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="93" style="background:linear-gradient(90deg,#0ea5e9,#00f0ff)"></div></div>
        </div>
<div class="bar-row">
          <div class="bar-meta"><span>#4 AMZN · Amazon</span><span style="color:#fff;font-weight:700">$2.24T</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="65" style="background:linear-gradient(90deg,#f59e0b,#00f0ff)"></div></div>
        </div>
<div class="bar-row">
          <div class="bar-meta"><span>#5 GOOGL · Alphabet</span><span style="color:#fff;font-weight:700">$2.12T</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="62" style="background:linear-gradient(90deg,#ef4444,#00f0ff)"></div></div>
        </div>
<div class="bar-row">
          <div class="bar-meta"><span>#6 META · Meta</span><span style="color:#fff;font-weight:700">$1.48T</span></div>
          <div class="bar-track"><div class="bar-fill" data-pct="43" style="background:linear-gradient(90deg,#3b82f6,#00f0ff)"></div></div>
        </div>
    </section>
  </main>
  <script>
    requestAnimationFrame(() => {
      document.querySelectorAll(".bar-fill").forEach((el) => { el.style.width = el.dataset.pct + "%"; });
    });
  </script>
</body>
</html>
